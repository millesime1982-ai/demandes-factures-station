<body>
<main class="shell">
<header>
<h1>Demandes de factures</h1>
<div class="header-actions">
<button class="round-action" id="historyButton" type="button" aria-label="Historique" title="Historique">
<svg viewBox="0 0 24 24" aria-hidden="true">
<path d="M3 12a9 9 0 1 0 3-6.7">
</path>
<path d="M3 4v5h5">
</path>
<path d="M12 7v5l3 2">
</path>
</svg>
</button>
<button class="round-action" id="settingsButton" type="button" aria-label="Réglages" title="Réglages">
<span aria-hidden="true">⚙</span>
</button>
</div>
</header>
<div class="reminder" id="reminder" hidden>N’oubliez pas d’envoyer les demandes de factures au comptable.</div>
<form class="panel" id="invoiceForm">
<div class="contacts">
<div class="picker field full">
<div class="client-picker-control">
<input id="company" required autocomplete="organization" placeholder="Client">
<button class="client-clear" id="clearSelectedClient" type="button" aria-label="Changer de client" title="Changer de client" hidden>×</button>
</div>
<ul class="suggest" id="suggestions">
</ul>
</div>
<div class="client-edit-row full" id="clientActions" hidden>
<button class="small" id="editSelectedClient" type="button">Modifier le client</button>
</div>
<div class="field full">
<input id="vat" placeholder="TVA" autocapitalize="characters">
</div>
<div class="address-block">
<div class="address-grid">
<input id="street" placeholder="Rue, numéro et boîte">
<input id="postalCode" inputmode="numeric" placeholder="Code postal">
<input id="city" placeholder="Ville">
</div>
</div>
<div class="email-wrap">
<input id="email1" type="email" inputmode="email" placeholder="E-mail">
<button class="email-plus" id="addEmail" type="button" aria-label="Ajouter un deuxième e-mail">+</button>
</div>
<div class="field hidden" id="email2Field">
<input id="email2" type="email" inputmode="email" placeholder="Deuxième e-mail">
</div>
</div>
<div class="lines">
<div class="line-head">
<span>Montant TTC</span>
<span>Type</span>
<span>Autre</span>
<span>
</span>
</div>
<div id="invoiceLines">
</div>
<button class="add add-line-button" id="addLine" type="button">Ajouter</button>
</div>
<button class="primary" id="saveButton">Enregistrer la demande</button>
</form>
<section class="current-panel" aria-labelledby="currentTitle">
<div class="list-head">
<h2 id="currentTitle">Demandes en cours</h2>
</div>
<div class="entries" id="currentEntries">
</div>
</section>
</main>
<dialog id="settingsDialog">
<div class="dialog-title">
<h2>Réglages</h2>
<button class="close" id="closeSettings" type="button">×</button>
</div>
<div class="field">
<label for="accountantEmail">E-mail du comptable</label>
<div class="accountant-email-wrap">
<input id="accountantEmail" type="email" inputmode="email" placeholder="Adresse principale">
<button class="email-plus" id="addAccountantEmail" type="button" aria-label="Ajouter une deuxième adresse">+</button>
</div>
<div class="accountant-second hidden" id="accountantEmail2Field">
<input id="accountantEmail2" type="email" inputmode="email" placeholder="Deuxième adresse">
</div>
</div>
<h3>Types de produits</h3>
<div id="productList">
</div>
<form class="product-add" id="productAddForm">
<input id="newProduct" required placeholder="Nouveau type">
<button class="small">Ajouter</button>
</form>
<h3>Sauvegarde</h3>
<button class="action" id="backupInvoices" type="button">Sauvegarder les factures envoyées</button>
</dialog>
<dialog class="history-dialog" id="historyDialog">
<div class="dialog-title">
<h2>Historique</h2>
<button class="close" id="closeHistory" type="button">×</button>
</div>
<input id="monthFilter" type="hidden">
<button class="action history-button" id="previewCurrent" type="button">Prévisualiser le fichier en cours</button>
<h3>Rechercher un fichier envoyé</h3>
<input id="archiveSearch" type="search" placeholder="Rechercher par date, client ou TVA">
<div class="cards" id="archiveList">
</div>
</dialog>
<dialog id="previewDialog">
<div class="dialog-title">
<h2 id="previewTitle">Aperçu avant envoi</h2>
<button class="close" id="closePreview" type="button">×</button>
</div>
<p class="hint" id="previewRecipient">
</p>
<div class="preview-sheet" id="previewText">
</div>
<div class="export">
<button class="action" id="sendAccountant" type="button">Envoyer au comptable</button>
<button class="action" id="previewDownload" type="button">Télécharger</button>
</div>
</dialog>
<div class="update-banner" id="updateBanner" hidden>
<span>Une nouvelle version est disponible.</span>
<button id="applyUpdate" type="button">Mettre à jour</button>
</div>
<div class="toast" id="toast">
</div>
<script>

function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function titleCase(v){return String(v||'').toLocaleLowerCase('fr').replace(/(^|[\s'’\-])\p{L}/gu,m=>m.toLocaleUpperCase('fr'))}function addressData(o){let a=o.addressDetails||{};return{street:a.street||o.street||o.address||'',box:a.box||o.box||'',postalCode:a.postalCode||o.postalCode||'',city:a.city||o.city||''}}function addressText(a){return[a.street,a.box&&`Boîte ${a.box}`,[a.postalCode,a.city].filter(Boolean).join(' ')].filter(Boolean).join(', ')}function client(c){let e=Array.isArray(c.emails)?c.emails:[c.email].filter(Boolean),a=addressData(c);return{company:c.company||'',vat:String(c.vat||'').toUpperCase(),addressDetails:a,address:addressText(a),emails:[e[0]||'',e[1]||'']}}function migrate(r){let lines=r.lines?.length?r.lines.map(x=>({amount:+x.amount||0,product:x.product||'Autre',month:x.month||'',plate:String(x.plate||r.plate||'')})):(r.items?.length?r.items:[{product:r.product||'Autre',amount:+r.amount||0}]).map((x,i)=>({amount:+x.amount||0,product:x.product||'Autre',month:(r.invoiceMonths||[])[i]||(r.invoiceMonths||[])[0]||'',plate:String(x.plate||r.plate||'')})),a=addressData(r);return{...r,lines,vat:String(r.vat||'').toUpperCase(),addressDetails:a,address:addressText(a),emails:(Array.isArray(r.emails)?r.emails:[r.email].filter(Boolean)).concat(['','']).slice(0,2),month:r.month||cur,amount:lines.reduce((s,x)=>s+x.amount,0)}}let records=read(SK,[]).map(migrate),clients=read(CK,[]).map(client),products=read(PK,DEF),archives=read(AK,[]),settings=read(SETK,{accountantEmail:'',accountantEmail2:''});if(!Array.isArray(products)||!products.length)products=[...DEF];if(!Array.isArray(archives))archives=[];settings.accountantEmail2=settings.accountantEmail2||'';filter.value=cur;$('accountantEmail').value=settings.accountantEmail||'';$('accountantEmail2').value=settings.accountantEmail2;
function save(){localStorage.setItem(SK,JSON.stringify(records));localStorage.setItem(CK,JSON.stringify(clients));localStorage.setItem(PK,JSON.stringify(products));localStorage.setItem(AK,JSON.stringify(archives));localStorage.setItem(SETK,JSON.stringify(settings))}function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function money(v){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(v)}function amount(v){return Number(String(v).replace(/\s/g,'').replace(',','.'))}function month(v){if(!v)return'Facture générale';if(/^\d{4}$/.test(v))return`Année ${v}`;let[y,p]=v.split('-');if(/^Q[1-4]$/.test(p))return`${p.slice(1)}${p==='Q1'?'er':'e'} trimestre ${y}`;if(/^S[12]$/.test(p))return`${p.slice(1)}${p==='S1'?'er':'e'} semestre ${y}`;return new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'}).format(new Date(+y,+p-1,1))}function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400)}
function opts(s=''){return'<option value="">Choisir…</option>'+products.map(p=>`<option${p===s?' selected':''}>${esc(p)}</option>`).join('')}function addLine(x={amount:'',product:'',plate:''}){let r=document.createElement('div');r.className='invoice-line';r.innerHTML=`<div class="money">

<span>€</span>

function crc32(bytes){let c=0xffffffff;for(let b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}function zipEntry(file,name,offset){let enc=new TextEncoder(),n=enc.encode(name),data=file.data,crc=crc32(data),local=new Uint8Array(30+n.length+data.length),lv=new DataView(local.buffer);lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0x0800,true);lv.setUint16(8,0,true);lv.setUint32(14,crc,true);lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);lv.setUint16(26,n.length,true);local.set(n,30);local.set(data,30+n.length);let central=new Uint8Array(46+n.length),cv=new DataView(central.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,n.length,true);cv.setUint32(42,offset,true);central.set(n,46);return{local,central}}async function zipFiles(files){let entries=[],offset=0;for(let f of files){let e=zipEntry({data:new Uint8Array(await f.file.arrayBuffer())},f.name,offset);entries.push(e);offset+=e.local.length}let centralSize=entries.reduce((s,e)=>s+e.central.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,entries.length,true);v.setUint16(10,entries.length,true);v.setUint32(12,centralSize,true);v.setUint32(16,offset,true);return new File([...entries.map(e=>e.local),...entries.map(e=>e.central),end],`sauvegarde-factures-envoyees-${new Date().toISOString().slice(0,10)}.zip`,{type:'application/zip'})}$('backupInvoices').onclick=async()=>{if(!archives.length)return toast('Aucune facture envoyée à sauvegarder.');let byMonth=new Map;[...archives].sort((a,b)=>b.sentAt.localeCompare(a.sentAt)).forEach(a=>{if(!byMonth.has(a.period))byMonth.set(a.period,a)});let files=[];for(let a of [...byMonth.values()].sort((a,b)=>a.period.localeCompare(b.period))){let groups=archiveGroups(
